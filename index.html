
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Aventura Começou</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10172a;color:white;font-family:Arial;text-align:center}
h1{color:#ffe66d;margin:14px 0 5px}
#info{padding:8px;font-size:17px}
canvas{display:block;width:100%;max-width:900px;margin:auto;background:#8bd8ff;border:3px solid white;touch-action:none}
#controls{display:flex;justify-content:center;gap:18px;padding:15px}
button{font-size:22px;padding:13px 22px;border:0;border-radius:14px;background:#ffe66d;font-weight:bold}
#msg{min-height:26px;color:#ffe66d}
</style>
</head>
<body>
<h1>🎮 A Aventura Começou</h1>
<div id="info">Fase: <span id="level">1</span> | 🪙 <span id="coins">0</span> | ❤️ <span id="lives">3</span></div>
<canvas id="game" width="800" height="400"></canvas>
<div id="msg">Colete moedas e alcance a bandeira!</div>
<div id="controls">
<button id="left">⬅️</button>
<button id="jump">⬆️ PULAR</button>
<button id="right">➡️</button>
</div>
<button onclick="restart()">🔄 Reiniciar</button>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
const W=800,H=400;
let level=1,coins=0,lives=3,world=0,done=false;
let keys={},player,items,enemies,platforms;
function setup(){
 world=0;done=false;
 player={x:35,y:290,w:28,h:36,vx:0,vy:0,ground:false};
 platforms=[
 {x:0,y:350,w:800,h:50},
 {x:150,y:290,w:110,h:16},
 {x:320,y:240,w:120,h:16},
 {x:510,y:290,w:110,h:16},
 {x:680,y:250,w:100,h:16}
 ];
 items=[{x:190,y:255},{x:355,y:205},{x:550,y:255},{x:710,y:215}];
 enemies=[
 {x:270,y:320,d:1},{x:450,y:320,d:-1},{x:620,y:320,d:1}
 ];
 document.getElementById('level').textContent=level;
 updateInfo();
}
function updateInfo(){
 document.getElementById('coins').textContent=coins;
 document.getElementById('lives').textContent=lives;
}
function restart(){level=1;coins=0;lives=3;setup();}
function next(){level++;if(level>3){document.getElementById('msg').textContent='🏆 Você venceu a aventura!';done=true;return;}setup();document.getElementById('msg').textContent='Fase '+level+'! Continue!';}
function move(k,on){keys[k]=on;}
for(let [id,k] of [['left','left'],['right','right'],['jump','jump']]){
 const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();move(k,true);});
 b.addEventListener('pointerup',()=>move(k,false));
 b.addEventListener('pointerleave',()=>move(k,false));
 b.addEventListener('pointercancel',()=>move(k,false));
}
document.addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key))e.preventDefault();
 if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;
 if(e.key==='ArrowRight'||e.key==='d')keys.right=true;
 if(e.key==='ArrowUp'||e.key===' ')keys.jump=true;
});
document.addEventListener('keyup',e=>{
 if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;
 if(e.key==='ArrowRight'||e.key==='d')keys.right=false;
 if(e.key==='ArrowUp'||e.key===' ')keys.jump=false;
});
function draw(){
 ctx.clearRect(0,0,W,H);
 let sky=ctx.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,'#63c8ff');sky.addColorStop(1,'#d7f6ff');
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 for(let i=0;i<5;i++){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(i*190+60,60+(i%2)*35,22,0,7);ctx.arc(i*190+85,55+(i%2)*35,28,0,7);ctx.fill();}
 let offset=Math.max(0,Math.min(player.x-250,0));
 ctx.save();ctx.translate(-offset,0);
 ctx.fillStyle='#3d9b53';ctx.fillRect(0,350,1500,50);
 ctx.fillStyle='#256b3a';ctx.fillRect(0,350,1500,8);
 for(let p of platforms){ctx.fillStyle='#9b633c';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#46b84f';ctx.fillRect(p.x,p.y,p.w,6);}
 for(let item of items){if(!item.got){ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(item.x,item.y,10,0,7);ctx.fill();ctx.strokeStyle='#fff3a0';ctx.stroke();}}
 for(let e of enemies){ctx.fillStyle='#e54d4d';ctx.fillRect(e.x,e.y,30,30);ctx.fillStyle='white';ctx.fillRect(e.x+5,e.y+7,6,7);ctx.fillRect(e.x+19,e.y+7,6,7);}
 ctx.fillStyle='#eee';ctx.fillRect(740,290,6,60);ctx.fillStyle='#ff4141';ctx.beginPath();ctx.moveTo(746,290);ctx.lineTo(790,305);ctx.lineTo(746,320);ctx.fill();
 ctx.fillStyle='#2355d9';ctx.fillRect(player.x,player.y,player.w,player.h);
 ctx.fillStyle='white';ctx.fillRect(player.x+17,player.y+8,6,7);
 ctx.fillStyle='#111';ctx.fillRect(player.x+20,player.y+10,3,4);
 ctx.restore();
}
function tick(){
 if(!done){
  if(keys.left)player.vx=-3.5;else if(keys.right)player.vx=3.5;else player.vx=0;
  if(keys.jump&&player.ground){player.vy=-11;player.ground=false;}
  player.x+=player.vx;player.vy+=0.48;player.y+=player.vy;
  player.x=Math.max(0,Math.min(770,player.x));
  player.ground=false;
  for(let p of platforms){
   if(player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h>=p.y&&player.y+player.h<=p.y+18&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.ground=true;}
  }
  for(let item of items){if(!item.got&&Math.abs(player.x+14-item.x)<23&&Math.abs(player.y+18-item.y)<25){item.got=true;coins++;updateInfo();}}
  for(let e of enemies){
   e.x+=e.d*(1+level*.35);if(e.x<e.min||e.x<260)e.d=1;if(e.x>e.max||e.x>680)e.d=-1;
   if(player.x+player.w>e.x&&player.x<e.x+30&&player.y+player.h>e.y&&player.y<e.y+30){lives--;updateInfo();player.x=35;player.y=290;player.vy=0;if(lives<=0){done=true;document.getElementById('msg').textContent='Fim de jogo! Toque em Reiniciar.';}}
  }
  if(player.x>700&&player.y+player.h>=290)next();
  if(player.y>H){lives--;updateInfo();player.x=35;player.y=290;player.vy=0;if(lives<=0){done=true;document.getElementById('msg').textContent='Fim de jogo! Toque em Reiniciar.';}}
 }
 draw();requestAnimationFrame(tick);
}
setup();tick();
</script>
</body>
</html>
